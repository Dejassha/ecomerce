# Ember Oak (Violet & Vine) - nginx site config
# Backend: Node/Express on 127.0.0.1:5500  (/api/*, /media/*)
# Frontend: static build in /var/www/html (from frontend/dist)
#
# Install for commerce.conf:
#   sudo cp nginx-ember-oak.conf /etc/nginx/sites-available/commerce.conf
#   sudo ln -sf /etc/nginx/sites-available/commerce.conf /etc/nginx/sites-enabled/commerce.conf
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid duplicate listen 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why images were broken:
# 1. proxy_pass http://127.0.0.1:5500/  (with trailing slash) strips the
#    location prefix, so /api/products -> /products (404) and
#    /media/x.svg never reached Express. Must be without trailing slash.
# 2. config proxied /uploads/ but backend now serves only /media/
#    (backend/server.js -> app.use("/media", ...)), so /media/* fell
#    through to index.html (200 text/html instead of image).

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    # Frontend (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - preserve /api/ prefix (NO trailing slash here)
    location /api/ {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend images - single media folder
    location /media/ {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        access_log off;
    }
}
